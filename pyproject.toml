[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p pytest_homeassistant_custom_component"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
files = ["custom_components/tplink_switch_snmp"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
# Home Assistant modules re-export their names without __all__
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["pysnmp.*", "aiooui"]
ignore_missing_imports = true
